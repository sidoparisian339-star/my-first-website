<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>موقعنا</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
            min-height: 100vh;
        }

        /* الصفحة الرئيسية */
        .website {
            min-height: 100vh;
            padding: 30px 20px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: #1b1b1b;
            border-radius: 12px;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
        }

        .content {
            text-align: center;
            margin-top: 100px;
        }

        .content h1 {
            font-size: 35px;
            margin-bottom: 15px;
        }

        .content p {
            color: #bbb;
            font-size: 18px;
        }

        /* نافذة العمر */
        .age-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.92);

            display: flex;
            justify-content: center;
            align-items: center;

            z-index: 9999;
        }

        .age-box {
            width: 90%;
            max-width: 420px;

            background: #1d1d1d;
            padding: 35px 25px;

            border-radius: 18px;
            text-align: center;

            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }

        .age-box h2 {
            font-size: 28px;
            margin-bottom: 15px;
        }

        .age-box p {
            color: #ccc;
            margin-bottom: 25px;
            line-height: 1.7;
        }

        .buttons {
            display: flex;
            gap: 12px;
        }

        button {
            flex: 1;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .yes {
            background: #18a957;
            color: white;
        }

        .no {
            background: #d93636;
            color: white;
        }

        button:active {
            transform: scale(0.97);
        }

        /* رسالة الرفض */
        .blocked {
            display: none;
            position: fixed;
            inset: 0;
            background: #111;

            justify-content: center;
            align-items: center;

            text-align: center;
            padding: 30px;

            z-index: 10000;
        }

        .blocked h2 {
            font-size: 28px;
            margin-bottom: 15px;
        }

        .blocked p {
            color: #bbb;
            line-height: 1.7;
        }
    </style>
</head>

<body>

    <div class="website">

        <header>
            <div class="logo">موقعنا</div>
        </header>

        <div class="content">
            <h1>مرحبًا بك</h1>
            <p>أهلًا وسهلًا بك في موقعنا.</p>
        </div>

    </div>


    <!-- نافذة التحقق من العمر -->

    <div class="age-overlay" id="ageOverlay">

        <div class="age-box">

            <h2>🔞 التحقق من العمر</h2>

            <p>
                هل عمرك 18 سنة أو أكثر؟
            </p>

            <div class="buttons">

                <button class="yes" onclick="enterWebsite()">
                    نعم، عمري 18+
                </button>

                <button class="no" onclick="blockWebsite()">
                    لا
                </button>

            </div>

        </div>

    </div>


    <!-- شاشة منع الدخول -->

    <div class="blocked" id="blocked">

        <div>

            <h2>لا يمكن الدخول</h2>

            <p>
                يجب أن يكون عمرك 18 سنة أو أكثر للدخول إلى هذا الموقع.
            </p>

        </div>

    </div>


    <script>

        function enterWebsite() {
            document.getElementById("ageOverlay").style.display = "none";
        }

        function blockWebsite() {
            document.getElementById("ageOverlay").style.display = "none";
            document.getElementById("blocked").style.display = "flex";
        }

    </script>

</body>
</html>
