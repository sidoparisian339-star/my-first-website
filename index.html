<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>موقعنا</title>

<!-- Cloudflare Turnstile -->
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html, body {
    width: 100%;
    height: 100%;
}

body {
    font-family: Arial, sans-serif;
    background: #050509;
    color: #fff;
    overflow: hidden;
}

.background {
    position: fixed;
    inset: 0;
    overflow: hidden;
    background:
        radial-gradient(circle at 50% 45%, #25133c 0%, #0b0810 38%, #020204 100%);
}

.light {
    position: absolute;
    width: 280px;
    height: 280px;
    border-radius: 50%;
    filter: blur(90px);
    opacity: .35;
    animation: floating 9s ease-in-out infinite alternate;
}

.light.one {
    background: #8b35ff;
    top: -80px;
    right: -70px;
}

.light.two {
    background: #ff176d;
    bottom: -100px;
    left: -80px;
    animation-delay: 2s;
}

@keyframes floating {
    from {
        transform: translate(0,0) scale(1);
    }
    to {
        transform: translate(70px,50px) scale(1.25);
    }
}

.stars {
    position: absolute;
    inset: 0;
    background-image:
        radial-gradient(circle, rgba(255,255,255,.7) 1px, transparent 1px);
    background-size: 75px 75px;
    opacity: .12;
    animation: starsMove 15s linear infinite;
}

@keyframes starsMove {
    from {
        transform: translateY(0);
    }
    to {
        transform: translateY(75px);
    }
}

.age-screen {
    position: fixed;
    inset: 0;
    z-index: 100;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 20px;

    background: rgba(0,0,0,.58);
    backdrop-filter: blur(14px);
}

.card {
    width: 100%;
    max-width: 440px;

    padding: 42px 25px 30px;

    text-align: center;

    border-radius: 28px;

    background: rgba(18,18,25,.86);

    border: 1px solid rgba(255,255,255,.16);

    box-shadow:
        0 0 25px rgba(155,60,255,.25),
        0 0 90px rgba(155,60,255,.12),
        inset 0 0 30px rgba(255,255,255,.025);

    animation: cardIn .8s cubic-bezier(.2,.8,.2,1);
}

@keyframes cardIn {
    from {
        opacity: 0;
        transform: scale(.85) translateY(35px);
    }

    to {
        opacity: 1;
        transform: scale(1) translateY(0);
    }
}

.icon {
    width: 86px;
    height: 86px;

    margin: 0 auto 24px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 50%;

    font-size: 42px;

    background: rgba(150,70,255,.10);

    border: 1px solid rgba(190,120,255,.65);

    box-shadow:
        0 0 12px rgba(180,80,255,.7),
        0 0 40px rgba(180,80,255,.35),
        inset 0 0 25px rgba(180,80,255,.15);

    animation: pulse 2.2s infinite ease-in-out;
}

@keyframes pulse {
    0%,100% {
        transform: scale(1);
        box-shadow:
            0 0 12px rgba(180,80,255,.7),
            0 0 40px rgba(180,80,255,.35);
    }

    50% {
        transform: scale(1.07);
        box-shadow:
            0 0 20px rgba(180,80,255,1),
            0 0 65px rgba(180,80,255,.5);
    }
}

h1 {
    font-size: 30px;
    margin-bottom: 13px;

    text-shadow:
        0 0 8px #fff,
        0 0 20px #a44cff,
        0 0 40px rgba(164,76,255,.7);
}

.description {
    color: #c6c6c6;
    font-size: 16px;
    line-height: 1.8;
    margin-bottom: 25px;
}

/* Turnstile */
.turnstile-box {
    display: flex;
    justify-content: center;
    margin-bottom: 22px;
    min-height: 65px;
}

.buttons {
    display: flex;
    gap: 14px;
}

button {
    flex: 1;

    padding: 16px 8px;

    border-radius: 15px;

    color: white;
    font-size: 16px;
    font-weight: bold;

    cursor: pointer;

    transition: .25s ease;
}

.yes {
    background: rgba(15,190,95,.13);
    border: 1px solid #20e477;

    box-shadow:
        0 0 10px rgba(32,228,119,.5),
        inset 0 0 15px rgba(32,228,119,.08);
}

.yes:hover {
    transform: translateY(-4px);
    background: rgba(20,210,105,.25);

    box-shadow:
        0 0 20px rgba(32,228,119,.9),
        0 0 45px rgba(32,228,119,.35);
}

.no {
    background: rgba(220,40,55,.13);
    border: 1px solid #ff4658;

    box-shadow:
        0 0 10px rgba(255,70,88,.5),
        inset 0 0 15px rgba(255,70,88,.08);
}

.no:hover {
    transform: translateY(-4px);
    background: rgba(230,45,60,.25);

    box-shadow:
        0 0 20px rgba(255,70,88,.9),
        0 0 45px rgba(255,70,88,.35);
}

button:active {
    transform: scale(.95);
}

.website {
    position: relative;
    z-index: 2;

    min-height: 100vh;
    padding: 20px;
}

.header {
    padding: 18px 22px;

    border-radius: 16px;

    background: rgba(20,20,25,.7);
    border: 1px solid rgba(255,255,255,.1);

    box-shadow: 0 0 25px rgba(150,70,255,.12);
}

.logo {
    font-size: 23px;
    font-weight: bold;

    text-shadow:
        0 0 8px white,
        0 0 20px #a44cff;
}

.main {
    text-align: center;
    margin-top: 120px;
}

.main h2 {
    font-size: 38px;

    text-shadow:
        0 0 10px white,
        0 0 30px #a44cff;
}

.main p {
    margin-top: 15px;
    color: #aaa;
}

.blocked {
    position: fixed;
    inset: 0;
    z-index: 200;

    display: none;

    align-items: center;
    justify-content: center;

    text-align: center;

    padding: 25px;

    background: #050509;
}

.blocked h2 {
    font-size: 30px;
    margin-bottom: 15px;
}

.blocked p {
    color: #aaa;
    line-height: 1.8;
}

@media (max-width: 500px) {

    .card {
        padding: 35px 18px 25px;
        border-radius: 23px;
    }

    .icon {
        width: 76px;
        height: 76px;
        font-size: 36px;
    }

    h1 {
        font-size: 26px;
    }

    .buttons {
        flex-direction: column;
    }

    button {
        width: 100%;
        padding: 17px;
    }

    .main {
        margin-top: 90px;
    }

    .main h2 {
        font-size: 30px;
    }
}
</style>
</head>

<body>

<div class="background">
    <div class="light one"></div>
    <div class="light two"></div>
    <div class="stars"></div>
</div>

<div class="website">

    <div class="header">
        <div class="logo">موقعنا</div>
    </div>

    <div class="main">
        <h2>مرحبًا بك</h2>
        <p>أهلًا وسهلًا بك في موقعنا.</p>
    </div>

</div>

<!-- نافذة 18+ -->
<div class="age-screen" id="ageScreen">

    <div class="card">

        <div class="icon">🔞</div>

        <h1>التحقق من العمر</h1>

        <p class="description">
            هذا الموقع مخصص للبالغين.
            <br>
            هل عمرك 18 سنة أو أكثر؟
        </p>

        <!-- Cloudflare Turnstile -->
        <div class="turnstile-box">

            <div
                class="cf-turnstile"
                data-sitekey="0x4AAAAAAEbw-sexQcW-COiM"
                data-theme="dark"
                data-callback="turnstileSuccess">
            </div>

        </div>

        <div class="buttons">

            <button
                class="yes"
                id="yesButton"
                onclick="enterSite()"
                disabled>
                ✓ نعم، عمري 18+
            </button>

            <button class="no" onclick="blockSite()">
                ✕ لا
            </button>

        </div>

    </div>

</div>

<!-- منع الدخول -->
<div class="blocked" id="blocked">

    <div>
        <h2>الدخول غير متاح</h2>

        <p>
            يجب أن يكون عمرك 18 سنة أو أكثر للدخول.
        </p>
    </div>

</div>

<script>

let turnstileVerified = false;

/* عندما ينجح Turnstile */
function turnstileSuccess(token) {

    if (token) {

        turnstileVerified = true;

        document.getElementById("yesButton").disabled = false;

    }
}

function enterSite() {

    if (!turnstileVerified) {

        alert("يرجى إكمال التحقق أولًا.");

        return;
    }

    const screen = document.getElementById("ageScreen");

    screen.style.transition = "opacity .5s ease";
    screen.style.opacity = "0";

    setTimeout(() => {

        screen.style.display = "none";

    }, 500);
}

function blockSite() {

    document.getElementById("ageScreen").style.display = "none";

    document.getElementById("blocked").style.display = "flex";

}

</script>

</body>
</html>
