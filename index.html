<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Xx ARABZONE — عرب زون</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --bg:#07060a;
    --card:#111018;
    --card2:#171521;
    --purple:#9b4dff;
    --purple2:#c28aff;
    --white:#ffffff;
    --muted:#9993a5;
    --border:rgba(255,255,255,.09);
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:Arial,Tahoma,sans-serif;
    background:var(--bg);
    color:var(--white);
    min-height:100vh;
}

/* =========================
   الخلفية
========================= */

body::before{
    content:"";
    position:fixed;
    inset:0;
    z-index:-3;

    background:
    radial-gradient(
        circle at 80% 0%,
        rgba(139,53,255,.22),
        transparent 35%
    ),
    radial-gradient(
        circle at 10% 80%,
        rgba(139,53,255,.10),
        transparent 35%
    ),
    #07060a;
}

body::after{
    content:"";
    position:fixed;
    inset:0;
    z-index:-2;

    opacity:.12;

    background-image:
    radial-gradient(
        circle,
        rgba(255,255,255,.8) 1px,
        transparent 1px
    );

    background-size:90px 90px;

    pointer-events:none;
}

/* =========================
   الهيدر
========================= */

header{
    position:sticky;
    top:0;
    z-index:100;

    background:rgba(7,6,10,.90);
    backdrop-filter:blur(18px);

    border-bottom:1px solid var(--border);
}

.nav{
    max-width:1200px;
    margin:auto;

    min-height:74px;

    padding:12px 18px;

    display:flex;
    align-items:center;

    gap:18px;
}

/* زر القائمة */

.menu{
    width:44px;
    height:44px;

    border-radius:12px;

    border:1px solid var(--border);

    background:#ffffff08;

    color:white;

    font-size:22px;

    cursor:pointer;

    transition:.25s;
}

.menu:hover{
    background:#9b4dff18;

    border-color:#9b4dff70;

    transform:scale(1.04);
}

/* =========================
   الشعار
========================= */

.logo{
    display:flex;

    align-items:center;

    gap:1px;

    white-space:nowrap;

    font-weight:900;

    cursor:pointer;

    user-select:none;
}
